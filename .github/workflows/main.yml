name: Build LOCKIN APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir -p android-project
          unzip -q "lockin-native-android (3).zip" -d android-project
          find android-project -name gradlew -type f

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        run: |
          PROJECT_DIR="$(dirname "$(find android-project -name gradlew -type f | head -n 1)")"
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: gradlew was not found"
            exit 1
          fi
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LOCKIN-debug-APK
          path: android-project/**/build/outputs/apk/debug/*.apk
